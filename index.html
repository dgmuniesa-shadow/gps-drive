<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020814">
  <title>GPS DRIVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="static-art" aria-label="GPS DRIVE Performance System">
    <svg class="artboard" viewBox="0 0 1600 800" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="art-title art-description">
      <title id="art-title">GPS DRIVE Performance System</title>
      <desc id="art-description">Velocímetro, límite de velocidad, estadísticas del recorrido y modo de pruebas con estética de competición.</desc>
      <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020812"/><stop offset=".52" stop-color="#020f1f"/><stop offset="1" stop-color="#020711"/></linearGradient>
        <radialGradient id="blueAtmosphere" cx=".15" cy="0" r=".78"><stop stop-color="#064078" stop-opacity=".72"/><stop offset="1" stop-color="#020812" stop-opacity="0"/></radialGradient>
        <radialGradient id="backgroundVignette" cx=".48" cy=".43" r=".82"><stop stop-color="#020812" stop-opacity="0"/><stop offset=".68" stop-color="#020812" stop-opacity=".08"/><stop offset="1" stop-color="#01040a" stop-opacity=".46"/></radialGradient>
        <linearGradient id="speedBand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00d7ff"/><stop offset=".39" stop-color="#0877ff"/><stop offset=".68" stop-color="#a121ff"/><stop offset="1" stop-color="#ff2441"/></linearGradient>
        <linearGradient id="activeTab" x1="0" y1="0" x2="1" y2=".35"><stop stop-color="#09b3ff"/><stop offset=".57" stop-color="#075be8"/><stop offset="1" stop-color="#f3295a"/></linearGradient>
        <linearGradient id="blueButton" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#0baaff"/><stop offset=".69" stop-color="#075be8"/><stop offset="1" stop-color="#063b83"/></linearGradient>
        <linearGradient id="darkButton" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#082442"/><stop offset="1" stop-color="#05244b"/></linearGradient>
        <linearGradient id="frameEdge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05e6ff"/><stop offset=".57" stop-color="#087fff"/><stop offset="1" stop-color="#ff2b4b"/></linearGradient>
        <linearGradient id="testEdge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#05eaff"/><stop offset=".76" stop-color="#087bff"/><stop offset="1" stop-color="#ff2948"/></linearGradient>
        <linearGradient id="tileBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081d36"/><stop offset="1" stop-color="#020b19"/></linearGradient>
        <linearGradient id="tileRed" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141727"/><stop offset="1" stop-color="#080b18"/></linearGradient>
        <linearGradient id="sliderBar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#008fff"/><stop offset=".43" stop-color="#3150f3"/><stop offset=".71" stop-color="#a321ff"/><stop offset="1" stop-color="#ff2949"/></linearGradient>
        <pattern id="carbon" width="10" height="10" patternTransform="rotate(42)" patternUnits="userSpaceOnUse"><path d="M0 0V10" stroke="#8499b2" stroke-opacity=".1" stroke-width="1"/></pattern>
        <pattern id="fineCarbon" width="14" height="14" patternTransform="rotate(42)" patternUnits="userSpaceOnUse"><path d="M0 0V14" stroke="#9bacc0" stroke-opacity=".055" stroke-width="2"/></pattern>
        <filter id="blueGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="redGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="signalGlow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="deepShadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="6"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <clipPath id="speedPanelClip"><path d="M40 256 82 215H1117V424L1081 460H78L40 423Z"/></clipPath>
        <clipPath id="limitPanelClip"><path d="M1140 274 1168 246H1550L1574 270V402L1546 430H1166L1140 404Z"/></clipPath>
        <clipPath id="tileOneClip"><path d="M42 491 59 474H390L407 491V543L390 560H59L42 543Z"/></clipPath>
        <clipPath id="tileTwoClip"><path d="M428 491 445 474H754L771 491V543L754 560H445L428 543Z"/></clipPath>
        <clipPath id="tileThreeClip"><path d="M792 491 809 474H1119L1136 491V543L1119 560H809L792 543Z"/></clipPath>
        <clipPath id="tileFourClip"><path d="M1157 491 1174 474H1515L1532 492V543L1515 560H1174L1157 543Z"/></clipPath>
        <clipPath id="testPanelClip"><path d="M41 659 64 636H1512L1558 682V745L1536 768H64L41 745Z"/></clipPath>
      </defs>

      <!-- Dark navy carbon-fiber field and the large slanted motorsport insignia -->
      <rect width="1600" height="800" fill="url(#background)"/>
      <rect width="1600" height="800" fill="url(#blueAtmosphere)"/>
      <path d="M0 0H620L172 454H0Z" fill="#0879ee" opacity=".12"/>
      <path d="M320 0H546L0 546V375Z" fill="#087eff" opacity=".07"/>
      <path d="M998 0H1300L510 800H310Z" fill="#12294a" opacity=".2"/>
      <path d="M1550 0H1600V800H1110Z" fill="#8b102d" opacity=".125"/>
      <rect width="1600" height="800" fill="url(#carbon)" opacity=".58"/>
      <rect width="1600" height="800" fill="url(#fineCarbon)" opacity=".35"/>
      <rect width="1600" height="800" fill="url(#backgroundVignette)"/>
      <g transform="skewX(-37)" opacity=".78">
        <path d="M625 112H810L690 324H505Z" fill="#087aff" opacity=".44"/>
        <path d="M838 112H1022L902 324H718Z" fill="#3938b5" opacity=".46"/>
        <path d="M1050 112H1232L1114 324H933Z" fill="#d31a3a" opacity=".4"/>
        <path d="M1262 112H1444V376H1164Z" fill="#8090a4" opacity=".22"/>
      </g>
      <path d="M1200 520 1598 91" stroke="#ff173c" stroke-opacity=".65" stroke-width="2"/>
      <path d="M1276 800 1598 456" stroke="#058fff" stroke-opacity=".56" stroke-width="3"/>
      <path d="M1355 800 1598 538" stroke="#0788ff" stroke-opacity=".24" stroke-width="1"/>

      <!-- Brand and disconnected GPS lamp -->
      <text x="70" y="27" class="brand-top">GPS</text>
      <text x="58" y="66" class="brand-main">DRIVE</text>
      <text x="60" y="91" class="brand-foot">PERFORMANCE SYSTEM</text>
      <g id="gpsStatus" class="gps-status is-disconnected" aria-live="polite">
        <circle class="status-lamp" cx="1260" cy="28" r="12" fill="#ff173d" filter="url(#signalGlow)"/>
        <circle cx="1257" cy="24" r="4" fill="#ffbac4" opacity=".8"/>
        <text id="gpsStatusText" x="1291" y="38">GPS DESCONECTADO</text>
      </g>

      <!-- Four slanted navigation panels -->
      <g class="nav-type" aria-label="Navegación principal">
        <g id="tab-drive" class="nav-tab interactive is-active" data-page="drive" role="button" tabindex="0" aria-label="Drive">
          <path d="M49 139H460L424 194H20Z" fill="url(#activeTab)" stroke="#0cbcff" stroke-width="2" filter="url(#blueGlow)"/>
          <text x="240" y="175" text-anchor="middle">DRIVE</text>
        </g>
        <g id="tab-laps" class="nav-tab interactive" data-page="laps" role="button" tabindex="0" aria-label="Lap Time">
          <path d="M480 139H850L814 194H444Z" fill="#030b19" fill-opacity=".96" stroke="#1c4e78" stroke-width="2"/>
          <text x="647" y="175" text-anchor="middle">LAP TIME</text>
        </g>
        <g id="tab-gps" class="nav-tab interactive" data-page="gps" role="button" tabindex="0" aria-label="GPS">
          <path d="M870 139H1238L1202 194H834Z" fill="#030b19" fill-opacity=".96" stroke="#1c4e78" stroke-width="2"/>
          <text x="1037" y="175" text-anchor="middle">GPS</text>
        </g>
        <g id="tab-settings" class="nav-tab interactive" data-page="settings" role="button" tabindex="0" aria-label="Ajustes">
          <path d="M1258 139H1573L1537 194H1222Z" fill="#030b19" fill-opacity=".96" stroke="#1c4e78" stroke-width="2"/>
          <text x="1397" y="175" text-anchor="middle">AJUSTES</text>
        </g>
      </g>

      <!-- Angled speed instrument housing -->
      <g id="view-drive" class="svg-view">
      <path d="M40 256 82 215H1117V424L1081 460H78L40 423Z" fill="#020d1c" fill-opacity=".95" stroke="url(#frameEdge)" stroke-width="3" filter="url(#deepShadow)"/>
      <g clip-path="url(#speedPanelClip)">
        <rect x="40" y="215" width="1080" height="245" fill="url(#carbon)" opacity=".12"/>
        <path d="M40 272H1117" stroke="#124b74" stroke-width="1.4"/>
        <path d="M40 423 78 460H1081L1117 424" fill="none" stroke="#087aff" stroke-opacity=".52" stroke-width="2"/>
        <path d="M40 256 82 215" stroke="#00dcff" stroke-width="4" filter="url(#blueGlow)"/>
        <path d="M1081 460 1117 424" stroke="#ff2546" stroke-width="4" filter="url(#redGlow)"/>
        <text x="99" y="260" class="panel-title">VELOCIDAD</text>
        <circle id="liveLamp" cx="922" cy="235" r="10" fill="#00f096" filter="url(#signalGlow)"/>
        <text id="liveLabel" x="951" y="245" class="live-text">LIVE DATA</text>
        <!-- Fixed-thickness profile; the JS reveals its fill along this same polygon. -->
        <path id="gaugeTrack" d="M156 390 440 286H1040L1025 315H445L164 410Z" fill="#162c44" stroke="#243a52" stroke-width="2"/>
        <path id="gaugeFill" d="" fill="url(#speedBand)" stroke="#18caff" stroke-width="3.4" filter="url(#blueGlow)"/>
        <g id="gaugeTicks" class="gauge-ticks" stroke="#f4f7fd" stroke-width="3"></g>
        <g id="gaugeLabels" class="gauge-labels"></g>
        <text id="speedNumber" x="601" y="415" text-anchor="middle" class="speed-value">0</text>
        <text x="601" y="442" text-anchor="middle" class="speed-unit">KM/H</text>
        <text x="760" y="395" text-anchor="start" class="meta-label">MAX <tspan id="maxInline">0</tspan> KM/H</text>
        <path d="M83 428H500" stroke="#173b58" stroke-width="1.3"/>
        <text x="760" y="419" text-anchor="start" class="meta-label">PRECISIÓN <tspan id="accuracy">--</tspan></text>
        <text id="mainLimitReading" x="760" y="443" text-anchor="start" class="meta-label limit-meta is-inactive">-</text>
      </g>

      <!-- Red edged speed limit housing -->
      <path d="M1140 274 1168 246H1550L1574 270V402L1546 430H1166L1140 404Z" fill="#031125" fill-opacity=".97" stroke="#ff3450" stroke-width="3" filter="url(#deepShadow)"/>
      <g clip-path="url(#limitPanelClip)">
        <rect x="1140" y="246" width="435" height="184" fill="url(#carbon)" opacity=".12"/>
      </g>

      <!-- Performance statistics -->
      <g>
        <path d="M42 491 59 474H390L407 491V543L390 560H59L42 543Z" fill="url(#tileBlue)" stroke="#00bfff" stroke-width="2"/>
        <g clip-path="url(#tileOneClip)"><path d="M286 560 413 495V563Z" fill="#087aff" opacity=".12"/><path d="m321 560 92-65" stroke="#148bff" stroke-opacity=".3" stroke-width="2"/></g>
        <text x="88" y="501" class="stat-title">MEDIA</text><text id="average" x="88" y="536" class="stat-number">0</text><text x="88" y="555" class="stat-unit">KM/H</text>

        <path d="M428 491 445 474H754L771 491V543L754 560H445L428 543Z" fill="url(#tileBlue)" stroke="#1760ff" stroke-width="2"/>
        <g clip-path="url(#tileTwoClip)"><path d="M651 560 777 495V563Z" fill="#087aff" opacity=".11"/></g>
        <text x="474" y="501" class="stat-title">MÁXIMA</text><text id="maximum" x="474" y="536" class="stat-number">0.0</text><text x="474" y="555" class="stat-unit">KM/H</text>

        <path d="M792 491 809 474H1119L1136 491V543L1119 560H809L792 543Z" fill="url(#tileRed)" stroke="#ff324e" stroke-width="2"/>
        <g clip-path="url(#tileThreeClip)"><path d="M1015 560 1142 495V563Z" fill="#ff254c" opacity=".13"/><path d="m1054 560 88-65" stroke="#ff254c" stroke-opacity=".32" stroke-width="2"/></g>
        <text x="838" y="501" class="stat-title">DISTANCIA</text><text id="distance" x="838" y="536" class="stat-number">0.00</text><text x="838" y="555" class="stat-unit">KM</text>

        <path d="M1157 491 1174 474H1515L1532 492V543L1515 560H1174L1157 543Z" fill="url(#tileBlue)" stroke="#069ff1" stroke-width="2"/>
        <g clip-path="url(#tileFourClip)"><path d="M1407 560 1539 493V563Z" fill="#067fff" opacity=".12"/><path d="m1438 560 100-65" stroke="#128bff" stroke-opacity=".3" stroke-width="2"/></g>
        <text x="1203" y="501" class="stat-title">TIEMPO</text><text id="duration" x="1203" y="536" class="stat-number stat-time">00:00</text><text x="1203" y="555" class="stat-unit">RECORRIDO</text>
      </g>

      <!-- Static GPS start and stop plates -->
      <g id="startGPS" class="interactive svg-button" role="button" tabindex="0" aria-label="Iniciar GPS">
        <path d="M50 616 79 574H430L407 616H48Z" fill="url(#blueButton)" stroke="#08baff" stroke-width="2" filter="url(#blueGlow)"/>
        <text x="238" y="603" text-anchor="middle" class="button-text">INICIAR GPS</text>
      </g>
      <g id="stopGPS" class="interactive svg-button is-disabled" role="button" tabindex="0" aria-label="Detener GPS" aria-disabled="true">
        <path d="M451 574H778L755 616H428Z" fill="url(#darkButton)" stroke="#155d98" stroke-width="2"/>
        <text x="603" y="603" text-anchor="middle" class="button-text button-dim">DETENER</text>
      </g>

      <!-- Simulation frame, decorative button, readout and slider -->
      <path d="M41 659 64 636H1512L1558 682V745L1536 768H64L41 745Z" fill="#030d1b" fill-opacity=".97" stroke="url(#testEdge)" stroke-width="3" filter="url(#deepShadow)"/>
      <g clip-path="url(#testPanelClip)">
        <rect x="41" y="636" width="1518" height="132" fill="url(#fineCarbon)" opacity=".26"/>
        <path d="M111 690H1520" stroke="#173c56" stroke-width="1.3"/>
        <text x="88" y="680" class="test-slashes">///</text>
        <text x="164" y="680" class="test-title">MODO DE PRUEBAS</text>
        <text x="1504" y="677" text-anchor="end" class="test-code">TEST <tspan fill="#ed356d">/</tspan> 01</text>
        <g id="testToggle" class="interactive svg-button" role="button" tabindex="0" aria-label="Activar simulación" aria-pressed="false">
          <path d="M88 738 116 704H598L574 742H66Z" fill="url(#blueButton)" stroke="#06bdff" stroke-width="2"/>
          <text id="testToggleLabel" x="332" y="731" text-anchor="middle" class="sim-button">ACTIVAR SIMULACIÓN</text>
        </g>
        <text x="688" y="704" text-anchor="middle" class="sim-caption">VELOCIDAD SIMULADA:</text>
        <text id="testSpeedValue" x="688" y="730" text-anchor="middle" class="sim-value">0 KM/H</text>
        <g id="testSpeed" class="interactive slider-control" role="slider" tabindex="0" aria-label="Velocidad simulada" aria-valuemin="0" aria-valuemax="300" aria-valuenow="0">
          <rect id="testSpeedTrack" x="857" y="718" width="557" height="10" rx="5" fill="url(#sliderBar)"/>
          <circle cx="863" cy="723" r="17" fill="#078fff" opacity=".45" filter="url(#blueGlow)"/>
          <circle id="testSpeedThumb" cx="863" cy="723" r="12" fill="#08aaff" stroke="#f6fbff" stroke-width="7"/>
        </g>
        <text id="testStatus" x="800" y="750" text-anchor="middle" class="sim-status">SIMULACIÓN DESACTIVADA</text>
      </g>
      </g>

      <g id="view-laps" class="svg-view secondary-view" style="display:none">
        <path d="M40 256 82 215H1558V740L1531 768H64L40 744Z" fill="#020d1c" fill-opacity=".96" stroke="url(#frameEdge)" stroke-width="3" filter="url(#deepShadow)"/>
        <path d="M82 272H1558" stroke="#124b74" stroke-width="1.4"/>
        <path d="M40 744 64 768H1531L1558 740" fill="none" stroke="#087aff" stroke-opacity=".45" stroke-width="2"/>
        <text x="99" y="260" class="panel-title">LAP TIME</text>
        <circle cx="1450" cy="240" r="9" fill="#00f096" filter="url(#signalGlow)"/>
        <text x="1480" y="249" text-anchor="end" class="live-text">GPS LAP TIMER</text>
        <path d="M95 300H1500V483H95Z" fill="#06162a" stroke="#194967" stroke-width="2"/>
        <text id="lapClock" x="797" y="419" text-anchor="middle" class="lap-clock">00:00.00</text>
        <text x="797" y="454" text-anchor="middle" class="page-label">CURRENT LAP / GPS TIMING</text>
        <text id="lapAutoStatus" x="797" y="475" text-anchor="middle" class="page-small">AUTO START ≥ 5 KM/H · FINISH CHECKPOINT NOT SET</text>
        <g id="lapStart" class="interactive svg-button" role="button" tabindex="0" aria-label="Iniciar cronómetro">
          <path d="M106 529 136 488H430L410 529H88Z" fill="url(#blueButton)" stroke="#08baff" stroke-width="2"/>
          <text x="258" y="515" text-anchor="middle" class="button-text">INICIAR</text>
        </g>
        <g id="lapMark" class="interactive svg-button" role="button" tabindex="0" aria-label="Registrar vuelta">
          <path d="M455 488H756L736 529H435Z" fill="url(#darkButton)" stroke="#155d98" stroke-width="2"/>
          <text x="595" y="515" text-anchor="middle" class="button-text button-dim">＋ VUELTA</text>
        </g>
        <g id="lapStop" class="interactive svg-button is-disabled" role="button" tabindex="0" aria-label="Detener cronómetro" aria-disabled="true">
          <path d="M782 488H1083L1063 529H762Z" fill="url(#darkButton)" stroke="#155d98" stroke-width="2"/>
          <text x="922" y="515" text-anchor="middle" class="button-text button-dim">DETENER</text>
        </g>
        <g id="lapReset" class="interactive svg-button" role="button" tabindex="0" aria-label="Reiniciar cronómetro">
          <path d="M1109 488H1483L1463 529H1089Z" fill="url(#darkButton)" stroke="#155d98" stroke-width="2"/>
          <text x="1286" y="515" text-anchor="middle" class="button-text button-dim">REINICIAR</text>
        </g>
        <path d="M94 553H1505" stroke="#173c56" stroke-width="1.3"/>
        <text x="100" y="584" class="page-label">VUELTAS REGISTRADAS</text>
        <text x="1490" y="584" text-anchor="end" class="page-small">GPS / TIME / SPEED</text>
        <g id="lapList"></g>
      </g>

      <g id="view-gps" class="svg-view secondary-view" style="display:none">
        <path d="M40 256 82 215H1558V740L1531 768H64L40 744Z" fill="#020d1c" fill-opacity=".96" stroke="url(#frameEdge)" stroke-width="3" filter="url(#deepShadow)"/>
        <path d="M82 272H1558" stroke="#124b74" stroke-width="1.4"/>
        <text x="99" y="260" class="panel-title">DATOS GPS / CHECKPOINTS</text>
        <g>
          <path d="M82 298 104 278H822L844 300V445L824 465H104L82 443Z" fill="url(#tileBlue)" stroke="#00bfff" stroke-width="2"/>
          <text x="120" y="325" class="page-label">LATITUD</text><text x="120" y="365" class="page-value" id="latitude">--</text>
          <text x="470" y="325" class="page-label">LONGITUD</text><text x="470" y="365" class="page-value" id="longitude">--</text>
          <text x="120" y="405" class="page-label">ALTITUD</text><text x="120" y="438" class="page-value page-value-small" id="altitude">--</text>
          <text x="470" y="405" class="page-label">PRECISIÓN GPS</text><text x="470" y="438" class="page-value page-value-small" id="gpsAccuracy">--</text>
        </g>
        <g id="saveCheckpoint" class="interactive svg-button" role="button" tabindex="0" aria-label="Guardar checkpoint">
          <path d="M99 498 127 460H523L503 498H82Z" fill="url(#blueButton)" stroke="#08baff" stroke-width="2"/>
          <text x="300" y="484" text-anchor="middle" class="button-text">＋ CHECKPOINT</text>
        </g>
        <text id="checkpointFeedback" x="550" y="486" class="page-small">GUARDA TU POSICIÓN GPS</text>
        <path d="M82 525H844" stroke="#173c56" stroke-width="1.3"/>
        <text x="100" y="553" class="page-label">PUNTOS GUARDADOS / PASOS</text>
        <g id="checkpointList"></g>
        <path d="M882 298 904 278H1495L1517 300V744L1493 766H904L882 744Z" fill="url(#tileBlue)" stroke="#1760ff" stroke-width="2"/>
        <text x="920" y="326" class="page-label">HISTORIAL DE SESIONES</text>
        <text x="920" y="353" class="page-small">RECORRIDOS GUARDADOS EN ESTE DISPOSITIVO</text>
        <g id="sessionHistory"></g>
      </g>

      <g id="view-settings" class="svg-view secondary-view" style="display:none">
        <path d="M40 256 82 215H1558V740L1531 768H64L40 744Z" fill="#020d1c" fill-opacity=".96" stroke="url(#frameEdge)" stroke-width="3" filter="url(#deepShadow)"/>
        <path d="M82 272H1558" stroke="#124b74" stroke-width="1.4"/>
        <text x="99" y="260" class="panel-title">AJUSTES DE CONDUCCIÓN</text>
        <path d="M82 303 106 280H782L804 302V721L782 744H106L82 721Z" fill="url(#tileBlue)" stroke="#00bfff" stroke-width="2"/>
        <text x="122" y="331" class="page-label">LÍMITE DE VELOCIDAD</text>
        <text id="limitReadout" x="120" y="410" class="setting-value">-</text><text x="270" y="408" class="limit-unit">KM/H</text>
        <g id="limitMinus" class="interactive svg-button" role="button" tabindex="0" aria-label="Bajar límite">
          <path d="M438 356H554L540 395H424Z" fill="url(#darkButton)" stroke="#17639b" stroke-width="2"/>
          <text x="489" y="384" text-anchor="middle" class="button-text button-dim">−</text>
        </g>
        <g id="limitPlus" class="interactive svg-button" role="button" tabindex="0" aria-label="Subir límite">
          <path d="M570 356H686L672 395H556Z" fill="url(#darkButton)" stroke="#17639b" stroke-width="2"/>
          <text x="621" y="384" text-anchor="middle" class="button-text button-dim">＋</text>
        </g>
        <path d="M122 443H752" stroke="#173c56" stroke-width="1.3"/>
        <text x="122" y="480" class="page-label">INICIO AUTOMÁTICO DE VUELTA</text>
        <text id="autoStartValue" x="122" y="522" class="page-value page-value-small">ACTIVADO</text>
